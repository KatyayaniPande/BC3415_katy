<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lama Robo Advisor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <!-- Link to Google Fonts for better typography -->

    <!-- Link to Font Awesome for icons -->

<body>
    <div class="container">
        <h2>Welcome to Lama Robo Advisor</h2>
        <div class="buttons">
            <form action="/financial_FAQ" method="post">
                <button type="submit"><i class="fas fa-chart-line"></i> Financial FAQ</button>
            </form>

            <form action="/singapore_joke" method="post">
                <button type="submit"><i class="fas fa-laugh"></i> Singapore Joke</button>
            </form>

            <form action="/sentiment_analysis" method="post">
                <button type="submit"><i class="fas fa-smile"></i> Sentiment Analysis</button>
            </form>
            <form action="/transfer_money" method="post">
                <button type="submit"><i class="fas fa-smile"></i> Transfer Money</button>
            </form>
        </div>
           </div>
