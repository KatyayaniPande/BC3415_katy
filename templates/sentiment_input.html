<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis Input</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            width: 90%;
            max-width: 700px;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.8em;
            color: #1976d2;
            text-align: center;
            margin-bottom: 25px;
        }
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 1em;
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #f44336;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            font-size: 1.1em;
            margin-bottom: 10px;
            display: block;
            color: #1976d2;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #90caf9;
            border-radius: 8px;
            font-size: 1em;
            resize: vertical;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            border-color: #42a5f5;
            outline: none;
            box-shadow: 0 0 5px rgba(66, 165, 245, 0.5);
        }
        .btn-success {
            background-color: #0288d1;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
            display: block;
            margin: 0 auto;
        }
        .btn-success:hover {
            background-color: #0277bd;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Enter Text for Sentiment Analysis</h1>

        {% if error %}
        <div class="alert" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/sentiment_analysis">
            <div class="form-group">
                <label for="text">Text:</label>
                <textarea class="form-control" id="text" name="text" rows="5" placeholder="Enter your text here..."></textarea>
            </div>
            <button type="submit" class="btn-success">Analyze Sentiment</button>
        </form>
    </div>
</body>
</html>
